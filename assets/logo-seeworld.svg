<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" stroke="currentColor">
  <!-- SEEWORLD — Symbole géométrique œil & globe -->
  
  <!-- Sphère / Globe extérieur (le monde) -->
  <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="3" />
  
  <!-- Méridien discret / axe de rotation -->
  <ellipse cx="50" cy="50" rx="18" ry="42" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.45" />

  <!-- Forme de l'œil (SEE / la vision) -->
  <path d="M 16 50 Q 50 21 84 50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 16 50 Q 50 79 84 50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Ligne d'horizon optique -->
  <line x1="8" y1="50" x2="16" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <line x1="84" y1="50" x2="92" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

  <!-- Iris et pupille centrale (le point focal de l'observation) -->
  <circle cx="50" cy="50" r="13" stroke="currentColor" stroke-width="2" />
  <circle cx="50" cy="50" r="6" fill="currentColor" />
  <circle cx="48" cy="48" r="1.8" fill="#ffffff" />
</svg>
