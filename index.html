<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEEWORLD — Regarder le monde</title>
  <meta name="description" content="SEEWORLD : l'écosystème et les projets logiciels, matériels, FPV et communautaires de Tom Bigot.">
  <link rel="canonical" href="https://seeworld.fr">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ================= BARRE DU HAUT ================= -->
  <nav class="topnav" aria-label="Navigation principale">
    <a href="#" class="brand" aria-label="SEEWORLD — Accueil">
      <img src="assets/logo-seeworld.svg" alt="Logo" class="brand-icon">
      <span>SEEWORLD</span>
    </a>
    <a href="https://tom-bigot.fr" target="_blank" rel="noopener" class="nav-pill">
      tom-bigot.fr ↗
    </a>
  </nav>

  <!-- ================= CONTENU PRINCIPAL ================= -->
  <main class="screen">
    
    <header class="home-head">
      <h1 class="big-title">SEEWORLD</h1>
      <p class="devise">Regarder le monde</p>
      
      <div class="search-box">
        <input 
          id="search-input" 
          class="search-input" 
          type="search" 
          placeholder="Rechercher un projet..." 
          autocomplete="off"
        >
      </div>
    </header>

    <!-- Grille des logos cliquables -->
    <section class="projects-grid" id="projects-grid" aria-label="Catalogue des projets">
      <!-- Injecté dynamiquement par app.js -->
    </section>

    <!-- Aucun résultat -->
    <div id="no-results" class="no-results">
      Aucun projet correspondant
    </div>

  </main>

  <!-- ================= PIED DE PAGE ================= -->
  <footer class="footer">
    <span>SEEWORLD &bull; Regarder le monde</span>
    <span>&copy; 2026 Tom Bigot</span>
    <a href="https://tom-bigot.fr" target="_blank" rel="noopener">tom-bigot.fr ↗</a>
  </footer>

  <!-- ================= TIROIR / MODALE MINIMALISTE ================= -->
  <div id="project-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <button id="modal-close-btn" class="modal-close" aria-label="Fermer">✕</button>
      
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="modal-head-logo">
          <img id="modal-logo" src="" alt="">
        </div>
        <div>
          <h3 id="modal-title" style="margin: 0; font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase;"></h3>
          <span id="modal-tag" style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted);"></span>
        </div>
      </div>

      <p id="modal-desc" style="color: var(--ink-soft); font-size: 14px; line-height: 1.6;"></p>

      <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
        <a id="modal-link" href="#" target="_blank" rel="noopener" class="btn">
          <span>OUVRIR LE PROJET</span>
          <span style="font-size: 13px;">↗</span>
        </a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
